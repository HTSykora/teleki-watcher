name: Teleki watcher
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check page for new links
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          API="https://teleki-xi-bp.edu.hu/wp-json/wp/v2/pages?slug=beiskolazas-2026-27-es-tanev"
          LINKS=$(curl -fs "$API" | jq -r '.[0].content.rendered' | grep -oE 'href="[^"]+"' | sort -u)
          [ -z "$LINKS" ] && exit 0
          if [ -f links.txt ] && [ "$LINKS" != "$(cat links.txt)" ]; then
            NEW=$(comm -13 links.txt <(echo "$LINKS"))
            curl -s -H "Title: Teleki page changed" -H "Priority: high" \
                 -d "New link(s): $NEW" "https://ntfy.sh/$TOPIC"
          fi
          echo "$LINKS" > links.txt
          git config user.name watcher
          git config user.email watcher@users.noreply.github.com
          git add links.txt
          git commit -m "update links" || true
          git push